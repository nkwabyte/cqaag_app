name: Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Custom release tag (e.g. v1.0.0+10). Leave empty to use auto-incremented build number."
        required: false
        default: ""
      is_draft:
        description: "Create draft release"
        type: boolean
        default: false
      is_prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Dynamic Version and Build Number
        id: versioning
        run: |
          # Read base semantic version and base build number from pubspec.yaml
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | tr -d '\r')
          APP_VERSION=$(echo "$PUBSPEC_VERSION" | cut -d '+' -f 1)
          PUBSPEC_BUILD_BASE=$(echo "$PUBSPEC_VERSION" | cut -d '+' -f 2)

          # Auto-increment build number per GitHub Actions run
          BUILD_OFFSET=${PUBSPEC_BUILD_BASE:-0}
          BUILD_NUMBER=$(( BUILD_OFFSET + ${{ github.run_number }} ))

          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="v${APP_VERSION}+${BUILD_NUMBER}"
          fi

          RELEASE_TITLE="CQAAG Mobile App v${APP_VERSION} (Build ${BUILD_NUMBER})"

          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "release_title=$RELEASE_TITLE" >> $GITHUB_OUTPUT
          echo "Configured Version: $APP_VERSION, Dynamic Build Number: $BUILD_NUMBER, Tag: $TAG"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Restore Secrets and Signing Configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ENV_FILE_BASE64: ${{ secrets.ENV_FILE_BASE64 }}
        run: |
          mkdir -p secrets

          # Decode .env
          if [ -n "$ENV_FILE_BASE64" ]; then
            echo "$ENV_FILE_BASE64" | base64 --decode > .env
            cp .env secrets/.env
            echo "Successfully restored .env configuration."
          else
            echo "::error::ENV_FILE_BASE64 secret is missing!"
            exit 1
          fi

          # Decode Keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > secrets/cqaag-keystore.jks
            echo "Successfully restored release keystore."
          else
            echo "::error::KEYSTORE_BASE64 secret is missing!"
            exit 1
          fi

          # Write key.properties for Android Gradle
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../secrets/cqaag-keystore.jks\n" \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          echo "Successfully generated android/key.properties."

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Code Generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Universal Release APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.versioning.outputs.app_version }}" \
            --build-number="${{ steps.versioning.outputs.build_number }}"

      - name: Build Split-ABI Release APKs
        run: |
          flutter build apk --split-per-abi --release \
            --build-name="${{ steps.versioning.outputs.app_version }}" \
            --build-number="${{ steps.versioning.outputs.build_number }}"

      - name: Prepare Release Artifacts and Checksums
        run: |
          mkdir -p release_assets

          # Copy Universal APK
          cp build/app/outputs/flutter-apk/app-release.apk "release_assets/cqaag-app-v${{ steps.versioning.outputs.app_version }}+${{ steps.versioning.outputs.build_number }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "release_assets/cqaag-app-universal.apk"

          # Copy Split APKs
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release_assets/cqaag-app-arm64-v8a.apk
          fi
          if [ -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release_assets/cqaag-app-armeabi-v7a.apk
          fi
          if [ -f build/app/outputs/flutter-apk/app-x86_64-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-x86_64-release.apk release_assets/cqaag-app-x86_64.apk
          fi

          # Generate SHA256 checksums
          cd release_assets
          sha256sum *.apk > SHA256SUMS.txt
          cd ..

          echo "Generated release assets:"
          ls -lh release_assets/

      - name: Create GitHub Release and Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: ${{ steps.versioning.outputs.release_title }}
          files: |
            release_assets/*.apk
            release_assets/SHA256SUMS.txt
          draft: ${{ github.event.inputs.is_draft || false }}
          prerelease: ${{ github.event.inputs.is_prerelease || false }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
